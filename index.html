<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Green AI">
<title>Green AI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
a{color:#FFB37A}a:hover{color:#FFD0A8}
@keyframes ballBounce{from{transform:translateY(-32px)}to{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){svg{animation:none !important}}
</style>
<style>
html, body { background: #0F1115; }
#app > div { width: 100% !important; max-width: 520px; height: 100vh !important; height: 100dvh !important; margin: 0 auto; }
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #F3F4F6; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<sc-if value="{{ showLang }}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; top: 20px; right: 20px; z-index: 5; display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
<button type="button" aria-label="{{ t.langLabel }}" aria-expanded="{{ langOpenAttr }}" onClick="{{ toggleLang }}" style="height: 44px; padding: 0 12px; border: none; border-radius: 14px; background: #1A1D24; color: #F3F4F6; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="7.2"></circle><path d="M1.8 9h14.4M9 1.8c2.4 2.2 2.4 12.2 0 14.4M9 1.8c-2.4 2.2-2.4 12.2 0 14.4"></path></svg>
<span>{{ langCode }}</span>
</button>
<sc-if value="{{ langOpen }}" hint-placeholder-val="{{ false }}">
<div style="width: 170px; padding: 6px; border-radius: 16px; background: #1A1D24; border: 1px solid #3A3F4B; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{ langs }}" as="item" hint-placeholder-count="2">
<button type="button" aria-pressed="{{ item.pressed }}" onClick="{{ item.pick }}" style="height: 44px; padding: 0 12px; border: none; border-radius: 12px; background: {{ item.bg }}; color: {{ item.fg }}; text-align: left; font-size: 16px; font-weight: 600">{{ item.label }}</button>
</sc-for>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ isAuth }}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; padding: 96px 28px 36px">
<div style="display: flex; flex-direction: column; gap: 18px">
<svg aria-hidden="true" width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round"><circle cx="28" cy="28" r="24"></circle><path d="M4 28h48M28 4v48M11 11c8 8 8 26 0 34M45 11c-8 8-8 26 0 34"></path></svg>
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 36px; line-height: 1.1">{{ au.title }}</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #B4B9C4">{{ au.body }}</p>
<sc-if value="{{ authEmailStep }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="email-input" style="font-size: 15px; font-weight: 600">{{ au.emailLabel }}</label>
<input id="email-input" dir="ltr" type="email" autocomplete="email" placeholder="ad@ornek.com" value="{{ emailDraft }}" onChange="{{ onEmail }}" style="height: 54px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 2px solid #3A3F4B; background: #1A1D24; color: #F3F4F6; font-family: inherit; font-size: 17px">
</div>
</sc-if>
<sc-if value="{{ authCodeStep }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="code-input" style="font-size: 15px; font-weight: 600">{{ au.codeLabel }}</label>
<input id="code-input" dir="ltr" type="text" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="••••••" value="{{ codeDraft }}" onChange="{{ onCode }}" style="height: 60px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 2px solid #3A3F4B; background: #1A1D24; color: #F3F4F6; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; letter-spacing: 8px; text-align: center">
<div style="padding: 12px 14px; border-radius: 12px; border: 1px dashed #3A3F4B; font-size: 14px; line-height: 1.4; color: #F3F4F6">{{ au.demo }}</div>
</div>
</sc-if>
<sc-if value="{{ hasAuthErr }}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 0; font-size: 15px; line-height: 1.4; color: #FF9B8A">{{ authErr }}</p>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<button type="button" onClick="{{ authPrimary }}" style="height: 58px; border: none; border-radius: 16px; background: {{accent}}; color: #0F1115; font-size: 18px; font-weight: 600">{{ au.primary }}</button>
<sc-if value="{{ authCodeStep }}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" onClick="{{ resendCode }}" style="height: 48px; border: 2px solid #3A3F4B; border-radius: 14px; background: transparent; color: #F3F4F6; font-size: 15px; font-weight: 500">{{ au.resend }}</button>
<button type="button" onClick="{{ changeEmail }}" style="height: 48px; border: 2px solid #3A3F4B; border-radius: 14px; background: transparent; color: #F3F4F6; font-size: 15px; font-weight: 500">{{ au.change }}</button>
</div>
</sc-if>
<button type="button" onClick="{{ authSkip }}" style="height: 44px; border: none; background: transparent; color: #B4B9C4; font-size: 15px; font-weight: 500; text-decoration: underline">{{ au.skip }}</button>
<p style="margin: 0; text-align: center; font-size: 13px; line-height: 1.4; color: #B4B9C4">{{ au.legal }}</p>
<sc-if value="{{ au.privacy }}" hint-placeholder-val="{{ true }}"><a href="gizlilik.html" style="align-self: center; min-height: 32px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 600">{{ au.privacy }}</a></sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{ isWelcome }}" hint-placeholder-val="{{ true }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 96px 28px 36px">
<div style="display: flex; flex-direction: column; gap: 20px">
<svg aria-hidden="true" width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round"><circle cx="28" cy="28" r="24"></circle><path d="M4 28h48M28 4v48M11 11c8 8 8 26 0 34M45 11c-8 8-8 26 0 34"></path></svg>
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 40px; line-height: 1.1">{{ t.welcomeTitle }}</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #B4B9C4">{{ t.welcomeBody }}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<button type="button" onClick="{{ start }}" style="height: 58px; border: none; border-radius: 16px; background: {{accent}}; color: #0F1115; font-size: 18px; font-weight: 600">{{ t.start }}</button>
<p style="margin: 0; text-align: center; font-size: 14px; color: #A3A8B3">{{ t.duration }}</p>
</div>
</div>
</sc-if>

<sc-if value="{{ isStep }}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; min-height: 0">

<div style="padding: 20px 104px 0 20px; display: flex; align-items: center; gap: 12px; height: 44px">
<button type="button" aria-label="{{ t.back }}" onClick="{{ back }}" style="width: 44px; height: 44px; flex-shrink: 0; border: none; border-radius: 14px; background: #1A1D24; color: #F3F4F6; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"></path></svg>
</button>
<div role="img" aria-label="{{ progressLabel }}" style="flex-grow: 1; height: 6px; border-radius: 3px; background: #262A33; overflow: hidden">
<div style="height: 6px; border-radius: 3px; background: {{accent}}; width: {{ progressWidth }}"></div>
</div>
<span style="font-size: 14px; color: #A3A8B3; flex-shrink: 0">{{ stepCount }}</span>
</div>

<div style="padding: 28px 24px 0; display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 30px; line-height: 1.15">{{ title }}</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.45; color: #B4B9C4">{{ subtitle }}</p>
</div>

<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 20px 24px 12px; display: flex; flex-direction: column; gap: 16px">

<sc-if value="{{ isGrid }}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ options }}" as="item" hint-placeholder-count="8">
<button type="button" aria-pressed="{{ item.pressed }}" onClick="{{ item.pick }}" style="height: 56px; border-radius: 14px; border: 2px solid {{ item.border }}; background: {{ item.bg }}; color: {{ item.fg }}; font-size: 18px; font-weight: 600">{{ item.label }}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ options }}" as="item" hint-placeholder-count="5">
<button type="button" aria-pressed="{{ item.pressed }}" onClick="{{ item.pick }}" style="min-height: 60px; padding: 12px 16px; border-radius: 16px; border: 2px solid {{ item.border }}; background: {{ item.bg }}; color: {{ item.fg }}; text-align: left; display: flex; flex-direction: column; gap: 3px; justify-content: center">
<span style="font-size: 17px; font-weight: 600">{{ item.label }}</span>
<span style="font-size: 14px; line-height: 1.35; color: {{ item.descColor }}">{{ item.desc }}</span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ isStyle }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ options }}" as="item" hint-placeholder-count="5">
<button type="button" aria-pressed="{{ item.pressed }}" onClick="{{ item.pick }}" style="min-height: 72px; padding: 12px 14px; border-radius: 16px; border: 2px solid {{ item.border }}; background: {{ item.bg }}; color: {{ item.fg }}; text-align: left; display: flex; align-items: center; gap: 14px">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: rgba(15,17,21,0.18); border: 1px solid {{ item.iconRing }}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{ item.icon }}"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 17px; font-weight: 600">{{ item.label }}</span>
<span style="font-size: 14px; line-height: 1.35; color: {{ item.descColor }}">{{ item.desc }}</span>
</span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ isStepper }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 16px; border-radius: 20px; background: #1A1D24">
<button type="button" aria-label="{{ t.decrease }}" onClick="{{ minus }}" style="width: 60px; height: 60px; border: none; border-radius: 18px; background: #262A33; color: #F3F4F6; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 11h14"></path></svg>
</button>
<div aria-live="polite" style="display: flex; align-items: baseline; gap: 6px">
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 60px; line-height: 1">{{ stepperValue }}</span>
<span style="font-size: 18px; color: #B4B9C4">{{ unit }}</span>
</div>
<button type="button" aria-label="{{ t.increase }}" onClick="{{ plus }}" style="width: 60px; height: 60px; border: none; border-radius: 18px; background: #262A33; color: #F3F4F6; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 11h14M11 4v14"></path></svg>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 14px; color: #A3A8B3">{{ t.quickHint }}</p>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ quick }}" as="item" hint-placeholder-count="8">
<button type="button" aria-pressed="{{ item.pressed }}" onClick="{{ item.pick }}" style="height: 48px; border-radius: 12px; border: 2px solid {{ item.border }}; background: {{ item.bg }}; color: {{ item.fg }}; font-size: 16px; font-weight: 600">{{ item.label }}</button>
</sc-for>
</div>
</div>
<sc-if value="{{ skippable }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{ skip }}" style="height: 48px; border: 2px solid #3A3F4B; border-radius: 14px; background: transparent; color: #F3F4F6; font-size: 16px; font-weight: 500">{{ t.skip }}</button>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ isNick }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ nickOptions }}" as="item" hint-placeholder-count="6">
<button type="button" aria-pressed="{{ item.pressed }}" onClick="{{ item.pick }}" style="height: 54px; padding: 0 8px; border-radius: 14px; border: 2px solid {{ item.border }}; background: {{ item.bg }}; color: {{ item.fg }}; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ item.label }}</button>
</sc-for>
</div>
<button type="button" onClick="{{ moreNicks }}" style="height: 48px; border: 2px solid #3A3F4B; border-radius: 14px; background: transparent; color: #F3F4F6; font-size: 16px; font-weight: 500">{{ t.moreNicks }}</button>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="nick-input" style="font-size: 15px; font-weight: 600">{{ t.nickOwn }}</label>
<input id="nick-input" type="text" autocomplete="off" value="{{ nickValue }}" onChange="{{ onNick }}" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 2px solid #3A3F4B; background: #0F1115; color: #F3F4F6; font-family: inherit; font-size: 17px">
<p style="margin: 0; font-size: 14px; line-height: 1.4; color: #B4B9C4">{{ t.nickNote }}</p>
</div>
</div>
</sc-if>

<sc-if value="{{ hasReaction }}" hint-placeholder-val="{{ false }}">
<div aria-live="polite" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: #1A1D24">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M4 5h14v10H9l-4 3v-3H4z"></path></svg>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #F3F4F6">{{ reaction }}</p>
</div>
</sc-if>

</div>

<div style="padding: 12px 24px 28px">
<button type="button" aria-disabled="{{ nextDisabled }}" onClick="{{ next }}" style="width: 100%; height: 58px; border: none; border-radius: 16px; background: {{ nextBg }}; color: {{ nextFg }}; font-size: 18px; font-weight: 600">{{ nextLabel }}</button>
</div>

</div>
</sc-if>

<sc-if value="{{ isSummary }}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column">
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 84px 24px 12px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 32px; line-height: 1.15">{{ t.sumTitle }}</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #B4B9C4">{{ summaryLine }}</p>
</div>
<div style="display: flex; flex-direction: column; border-radius: 20px; background: #1A1D24; padding: 6px 18px">
<sc-for list="{{ summary }}" as="row" hint-placeholder-count="11">
<div style="display: flex; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid #262A33">
<span style="font-size: 15px; color: #B4B9C4; flex-shrink: 0">{{ row.label }}</span>
<span style="font-size: 15px; font-weight: 600; text-align: right">{{ row.value }}</span>
</div>
</sc-for>
</div>
</div>
<div style="padding: 12px 24px 28px; display: flex; flex-direction: column; gap: 10px">
<button type="button" onClick="{{ createPlan }}" style="height: 58px; border: none; border-radius: 16px; background: {{accent}}; color: #0F1115; font-size: 18px; font-weight: 600">{{ t.createPlan }}</button>
<button type="button" onClick="{{ restart }}" style="height: 48px; border: none; border-radius: 14px; background: transparent; color: #F3F4F6; font-size: 16px; font-weight: 500">{{ t.editAnswers }}</button>
</div>
</div>
</sc-if>

<sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 110px 28px 44px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 28px">
<div style="height: 96px; display: flex; align-items: flex-end">
<svg aria-hidden="true" width="64" height="64" viewBox="0 0 56 56" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" style="animation: ballBounce 0.7s ease-in infinite alternate"><circle cx="28" cy="28" r="24"></circle><path d="M4 28h48M28 4v48M11 11c8 8 8 26 0 34M45 11c-8 8-8 26 0 34"></path></svg>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 28px; line-height: 1.15">{{ t.loadTitle }}</h1>
<p aria-live="polite" style="margin: 0; font-size: 16px; color: #B4B9C4">{{ loadStatus }}</p>
</div>
<div style="width: 100%; display: flex; flex-direction: column; gap: 8px">
<div role="img" aria-label="{{ loadPercent }}" style="height: 8px; border-radius: 4px; background: #262A33; overflow: hidden">
<div style="height: 8px; border-radius: 4px; background: {{accent}}; width: {{ loadPercent }}; transition: width 0.15s linear"></div>
</div>
<span style="font-size: 14px; color: #B4B9C4; text-align: right">{{ loadPercent }}</span>
</div>
</div>
<div aria-live="polite" style="padding: 20px; border-radius: 22px; background: #1A1D24; display: flex; flex-direction: column; gap: 10px; min-height: 150px; box-sizing: border-box">
<span style="font-size: 13px; font-weight: 600; color: {{accent}}">{{ t.factLabel }}</span>
<p style="margin: 0; font-size: 19px; line-height: 1.4; font-weight: 500">{{ fact }}</p>
</div>
</div>
</sc-if>

<sc-if value="{{ isComp }}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column">
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 84px 24px 12px; display: flex; flex-direction: column; gap: 18px">
<span style="font-size: 14px; font-weight: 600; color: {{accent}}">{{ c.kicker }}</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 40px; line-height: 1.05">{{ c.name }}</h1>
<div style="padding: 16px; border-radius: 18px; background: #1A1D24; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ compReasons }}" as="rs" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.4">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><path d="M3.500 8.500 6.500 11.500 12.500 4.500"></path></svg>
<span>{{ rs.text }}</span>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #B4B9C4">{{ c.note }}</p>
<h2 style="margin: 6px 0 0; font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.2">{{ c.question }}</h2>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{ compDrills }}" as="dr" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #1A1D24; font-size: 14px; font-weight: 500">
<span>{{ dr.name }}</span>
<span style="flex-shrink: 0; color: #B4B9C4">{{ dr.amount }}</span>
</div>
</sc-for>
</div>
</div>
<div style="padding: 12px 24px 28px; display: flex; flex-direction: column; gap: 10px">

<div id="install" role="dialog" aria-labelledby="install-t" style="display:none; position:fixed; left:12px; right:12px; bottom:92px; z-index:50; max-width:496px; margin:0 auto; padding:14px 16px; border-radius:16px; background:#1A1D24; border:1px solid #3A3F4B; color:#F3F4F6; font-family:Inter, system-ui, sans-serif; flex-direction:column; gap:10px; box-shadow:0 8px 24px rgba(0,0,0,.45)">
  <strong id="install-t" style="font-size:16px"></strong>
  <span id="install-body" style="font-size:14px; line-height:1.4; color:#B4B9C4"></span>
  <div style="display:flex; gap:8px">
    <button id="install-yes" type="button" style="min-height:44px; padding:0 16px; border:none; border-radius:12px; background:#FF8A3D; color:#0F1115; font:inherit; font-size:15px; font-weight:600"></button>
    <button id="install-no" type="button" style="min-height:44px; padding:0 16px; border:2px solid #3A3F4B; border-radius:12px; background:transparent; color:#F3F4F6; font:inherit; font-size:15px; font-weight:600"></button>
  </div>
</div>
<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
(function () {
  const box = document.getElementById("install"), body = document.getElementById("install-body"), yes = document.getElementById("install-yes"), no = document.getElementById("install-no");
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  let dismissed = false; try { dismissed = localStorage.getItem("greenai.installDismissed") === "1"; } catch (e) {}
  if (standalone || dismissed) return;
  const app = () => { try { return JSON.parse(localStorage.getItem("basketballAi.v2") || "{}"); } catch (e) { return {}; } };
  const en = () => (app().lang || "tr") !== "tr";
  let deferred = null, pending = null;
  function show(kind) {
    pending = kind;
    if (!app().onboarded) return;
    const ua = navigator.userAgent, safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
    document.getElementById("install-t").textContent = (window.__tx || String)(en() ? "Install Green AI on your phone" : "Green AI'ı telefonuna yükle");
    body.textContent = (window.__tx || String)(kind === "prompt"
      ? (en() ? "Add it to your home screen: it opens full screen like an app and works offline." : "Ana ekranına ekle: uygulama gibi tam ekran açılır ve internetsiz de çalışır.")
      : (safari
        ? (en() ? "Tap the Share button (square with an up arrow), then choose \"Add to Home Screen\"." : "Paylaş düğmesine (kare ve yukarı ok) dokun, sonra \"Ana Ekrana Ekle\"yi seç.")
        : (en() ? "Open this page in Safari, then Share > \"Add to Home Screen\"." : "Bu sayfayı Safari ile aç, sonra Paylaş > \"Ana Ekrana Ekle\"yi seç.")));
    yes.textContent = (window.__tx || String)(en() ? "Install" : "Yükle");
    no.textContent = (window.__tx || String)(en() ? "Not now" : "Şimdi değil");
    yes.style.display = kind === "prompt" ? "" : "none";
    box.style.display = "flex";
  }
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; show("prompt"); });
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios) setTimeout(() => show("ios"), 2500);
  setInterval(() => { if (pending && box.style.display === "none" && app().onboarded && !dismissed) show(pending); }, 3000);
  yes.onclick = async () => { if (!deferred) return; deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; pending = null; box.style.display = "none"; };
  no.onclick = () => { dismissed = true; pending = null; box.style.display = "none"; try { localStorage.setItem("greenai.installDismissed", "1"); } catch (e) {} };
  window.addEventListener("appinstalled", () => { pending = null; box.style.display = "none"; });
})();
</script>

<div id="gaToast" role="status" style="display:none; position:fixed; left:12px; right:12px; top:16px; z-index:60; max-width:496px; margin:0 auto; padding:14px 16px; border-radius:14px; background:#2A1A18; border:1px solid #FF9B8A; color:#F3F4F6; font:15px/1.4 Inter, system-ui, sans-serif"></div>
<script>
// Canlı şut takibi açılmadan önce takip.html sitede var mı bak; yoksa 404 yerine ne yapılacağını söyle
document.addEventListener("click", async (e) => {
  const a = e.target.closest && e.target.closest('a[href="takip.html"]');
  if (!a) return;
  e.preventDefault();
  let ok = true;
  try { const r = await fetch("takip.html", { cache: "no-store" }); ok = r.ok; } catch (err) { ok = true; }
  if (ok) { location.href = "takip.html"; return; }
  let en = false; try { en = (JSON.parse(localStorage.getItem("basketballAi.v2") || "{}").lang || "tr") !== "tr"; } catch (err) {}
  const t = document.getElementById("gaToast");
  t.textContent = (window.__tx || String)(en
    ? 'The shot tracking file (takip.html) is not on your site. Upload it to your GitHub repository; its name must be exactly "takip.html".'
    : 'Şut takibi dosyası (takip.html) sitede yok. GitHub deposuna yükle; adı tam olarak "takip.html" olmalı.');
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 8000);
}, true);
</script>
